name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test:
    name: Build + test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux build deps
        if: runner.os == 'Linux'
        # bubblewrap + netcat-openbsd are for the egress-sandbox test suite
        # (src/sandbox.rs, src/procsandbox.rs) — bwrap is the actual Linux
        # sandbox backend under test, nc is used as the "proxy-blind tool"
        # in nc_gets_no_network_under_the_sandbox.
        run: sudo apt-get update && sudo apt-get install -y libssl-dev pkg-config bubblewrap netcat-openbsd
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release
      - run: cargo test --release
